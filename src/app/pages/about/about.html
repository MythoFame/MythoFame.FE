<div class="content">
  <div class="mx-auto w-full lg:w-2/3">
    <div class="flex flex-col-reverse items-center justify-between gap-8 lg:flex-row">
      <div class="flex-[1.2]">
        <h1
          class="decoration-accent text-3xl font-bold underline decoration-2 underline-offset-4"
          [innerHtml]="'about.hero.title' | translate"
        ></h1>
        <p class="text-lg font-semibold italic">{{ 'about.hero.description' | translate }}</p>
      </div>
      <div class="flex-[0.8]">
        <img class="pixelated rounded-2xl" src="/images/fame.png" alt="Logo" />
      </div>
    </div>
  </div>

  <p></p>
</div>
