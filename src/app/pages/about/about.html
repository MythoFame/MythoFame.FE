<div class="content mx-auto flex max-w-6xl flex-col gap-22">
  <div class="flex flex-col-reverse items-center justify-between gap-8 lg:flex-row">
    <div class="flex-[1.2]">
      <h1
        class="decoration-accent text-3xl font-bold underline decoration-2 underline-offset-4"
        [innerHtml]="'about.hero.title' | translate"
      ></h1>
      <p class="mt-4 text-lg font-semibold italic" [innerHtml]="'about.hero.description' | translate"></p>
    </div>
    <div class="flex-[0.8]">
      <img class="pixelated rounded-2xl" src="images/fame.png" alt="MythoFame logo" />
    </div>
  </div>

  <div class="border-secondary border-t-2"></div>

  <div class="flex flex-col gap-8">
    <div class="lg:max-w-2/3">
      <h2 class="text-2xl font-bold">{{ 'about.content.hero.title' | translate }}</h2>
      <p class="text-muted-foreground mt-4">{{ 'about.content.hero.description' | translate }}</p>
    </div>

    <div class="grid items-stretch gap-4 md:grid-cols-2">
      <m-card title="about.content.mods.title" description="about.content.mods.description" />
      <m-card title="about.content.maps.title" description="about.content.maps.description" />
      <m-card title="about.content.scripts.title" description="about.content.scripts.description" />
      <m-card title="about.content.resources.title" description="about.content.resources.description" />
    </div>

    <m-card
      [kind]="'secondary'"
      [titleAlign]="'center'"
      title="about.community.title"
      [descriptionAlign]="'center'"
      description="about.community.description"
    >
      <p class="text-primary mt-4 text-center text-sm font-semibold italic">
        {{ 'about.community.closing' | translate }}
      </p>
    </m-card>
  </div>
</div>
