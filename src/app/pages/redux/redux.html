<div class="content mx-auto flex max-w-6xl flex-col gap-34">
  <div class="flex flex-col items-center gap-8 text-center">
    <img class="pixelated lg:max-w-2/3" src="images/redux/logo.gif" alt="Logo" />
    <p class="font-semibold lg:text-lg" [innerHtml]="'redux.hero.description' | translate"></p>
  </div>

  <div class="border-secondary w-full border-t-2"></div>

  <div class="flex w-full flex-col items-center justify-center gap-22">
    <div class="flex w-full flex-col-reverse items-center justify-between gap-12 lg:flex-row">
      <div class="flex-[1.2]">
        <h1 class="text-xl font-semibold" [innerHtml]="'redux.skins.title' | translate"></h1>
        <p class="mt-2" [innerHtml]="'redux.skins.description' | translate"></p>
      </div>
      <div class="relative max-w-200 flex-[0.8]">
        <img
          class="pixelated max-w-100 rounded-2xl shadow-xl lg:absolute lg:top-8 lg:left-32 lg:-translate-y-1/2"
          src="images/redux/skins2.gif"
          alt="Skins 2"
        />
        <img
          class="pixelated hidden max-w-100 rounded-2xl shadow-xl lg:absolute lg:top-0 lg:left-0 lg:block lg:-translate-y-1/2"
          src="images/redux/skins1.gif"
          alt="Skins 1"
        />
      </div>
    </div>

    <div class="border-secondary w-full border-t-2"></div>

    <div class="flex w-full flex-col-reverse items-center justify-between gap-12 lg:flex-row-reverse">
      <div class="flex-[1.2]">
        <h1 class="text-xl font-semibold" [innerHtml]="'redux.weapons.title' | translate"></h1>
        <p class="mt-2" [innerHtml]="'redux.weapons.description' | translate"></p>
      </div>
      <div class="flex-[0.8]">
        <img class="pixelated max-w-100 rounded-2xl shadow-xl" src="images/redux/weapons.gif" alt="Weapons" />
      </div>
    </div>
  </div>
</div>
