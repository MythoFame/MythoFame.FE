<div class="content mx-auto flex max-w-6xl flex-col gap-34">
  <div class="flex w-full flex-col items-center gap-8 text-center">
    <img class="pixelated w-full max-w-150" src="images/redux/logo.gif" alt="SFR Logo" />
    <p class="font-semibold lg:text-lg" [innerHtml]="'redux.hero.description' | translate"></p>
  </div>

  <div class="border-secondary w-full border-t-2"></div>

  <div class="flex w-full flex-col items-center justify-center gap-22">
    <div class="flex w-full flex-col-reverse items-center justify-between gap-12 md:flex-row">
      <div class="w-full flex-[1.2] text-center md:text-left">
        <h1 class="text-xl font-semibold" [innerHtml]="'redux.skins.title' | translate"></h1>
        <p class="mt-2" [innerHtml]="'redux.skins.description' | translate"></p>
      </div>
      <div class="relative w-full flex-[0.8]">
        <img
          class="pixelated top-0 left-0 w-full rounded-2xl shadow-xl lg:absolute lg:w-2/3 lg:-translate-y-1/2"
          src="images/redux/skins1.gif"
          alt="Skins 1"
        />
        <img
          class="pixelated -top-8 -left-32 hidden w-2/3 rounded-2xl shadow-xl lg:absolute lg:block lg:-translate-y-1/2"
          src="images/redux/skins2.gif"
          alt="Skins 2"
        />
      </div>
    </div>

    <div class="border-secondary w-full border-t-2"></div>

    <div class="flex w-full flex-col-reverse items-center justify-between gap-12 md:flex-row-reverse">
      <div class="w-full flex-[1.2] text-center md:text-left">
        <h1 class="text-xl font-semibold" [innerHtml]="'redux.weapons.title' | translate"></h1>
        <p class="mt-2" [innerHtml]="'redux.weapons.description' | translate"></p>
      </div>
      <div class="w-full flex-[0.8]">
        <img class="pixelated w-full rounded-2xl shadow-xl" src="images/redux/weapons.gif" alt="Weapons" />
      </div>
    </div>

    <div class="border-secondary w-full border-t-2"></div>

    <div class="flex w-full flex-col-reverse items-center justify-between gap-12 md:flex-row">
      <div class="w-full flex-[1.2] text-center md:text-left">
        <h1 class="text-xl font-semibold" [innerHtml]="'redux.more.title' | translate"></h1>
        <p class="mt-2" [innerHtml]="'redux.more.description' | translate"></p>
      </div>
      <div class="w-full flex-[0.8]">
        <img class="pixelated w-full rounded-2xl shadow-xl" src="images/redux/more.gif" alt="More" />
      </div>
    </div>
  </div>

  <div class="border-secondary w-full border-t-2"></div>

  <div>
    <h1
      class="decoration-accent text-center text-4xl font-bold underline decoration-2"
      [innerHtml]="'redux.forks.title' | translate"
    ></h1>
    <div class="mt-14 flex flex-col items-center gap-22">
      <div class="flex w-full flex-col items-center gap-4 text-center">
        <img class="pixelated w-full max-w-150" src="images/sfdct/logo.gif" alt="SFDCT Logo" />
        <p class="italic" [innerHtml]="'redux.sfdct.description' | translate"></p>
      </div>
    </div>
  </div>
</div>
