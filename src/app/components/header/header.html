<div
  class="bg-muted fixed top-0 left-0 z-100 flex h-(--header-size) w-full items-center justify-center shadow-lg md:bg-transparent md:backdrop-blur-lg"
>
  <div class="flex w-11/12 items-center justify-between md:w-3/4">
    @if (isMobile()) {
      <div>
        <m-button [kind]="'transparent'" (onClick)="toggleMenu()">
          <svg
            class="duration-500 ease-out"
            [ngClass]="{ 'rotate-180': isMenuOpen() }"
            lucideChevronRight
            size="18"
          ></svg>
        </m-button>

        <div
          [ngClass]="{ 'text-foreground! w-4/5': isMenuOpen() }"
          class="text-muted border-secondary bg-muted fixed top-0 -left-0.5 mt-(--header-size) flex h-screen w-0 flex-col items-center gap-6 overflow-hidden border-r py-6 duration-500 ease-out"
        >
          @for (route of routes; track route.link) {
            <div class="min-w-4/5">
              <m-button
                [disabled]="route.disabled"
                [kind]="'transparent'"
                class="w-full justify-start font-semibold text-nowrap"
                (onClick)="navigate(route.link)"
              >
                {{ route.label | translate }}
              </m-button>
            </div>
          }
        </div>
      </div>
    } @else {
      <div class="font-grotesk flex items-center gap-4">
        @for (route of routes; track route.link) {
          <m-button
            [disabled]="route.disabled"
            [kind]="'transparent'"
            class="font-semibold"
            (onClick)="navigate(route.link)"
          >
            {{ route.label | translate }}
          </m-button>
        }
      </div>
    }
    <div class="flex items-center gap-2">
      <m-button [kind]="'transparent'" (onClick)="toggleTheme()">
        <svg lucideSunMoon size="28" alt="Toggle Theme"></svg>
      </m-button>
      <m-button [kind]="'transparent'" (onClick)="visitGithub()">
        <svg class="fill-foreground w-8" alt="GitHub" viewBox="0 0 640 640">
          <path
            d="M280.5 426.5c-66-8-112.5-55.5-112.5-117 0-25 9-52 24-70-6.5-16.5-5.5-51.5 2-66 20-2.5 47 8 63 22.5 19-6 39-9 63.5-9s44.5 3 62.5 8.5c15.5-14 43-24.5 63-22 7 13.5 8 48.5 1.5 65.5 16 19 24.5 44.5 24.5 70.5 0 61.5-46.5 108-113.5 116.5 17 11 28.5 35 28.5 62.5v52c0 15 12.5 23.5 27.5 17.5C505 523.5 576 433 576 321c0-141.5-115-257-256.5-257S64 179.5 64 321c0 111 70.5 203 165.5 237.5 13.5 5 26.5-4 26.5-17.5v-40c-7 3-16 5-24 5-33 0-52.5-18-66.5-51.5-5.5-13.5-11.5-21.5-23-23-6-.5-8-3-8-6 0-6 10-10.5 20-10.5 14.5 0 27 9 40 27.5 10 14.5 20.5 21 33 21s20.5-4.5 32-16c8.5-8.5 15-16 21-21"
          />
        </svg>
      </m-button>
    </div>
  </div>
</div>
